etl:
  esEndpoint: elasticsearch
  etlMapping:
    mappings:
        - name: qa_vpodc_case
          doc_type: case
          type: aggregator
          root: case
          props:
            - name: project_id
            - name: submitter_id
          nested_props:
            - name: clinical_demographics
              path: clinical_demographics
              props:
                - name: Ethnicity
                - name: Gender
                - name: Race
            - name: exposures
              path: exposures
              props:
                - name: DRINK_CURRENT
                - name: DRINK_MIN_12
                - name: DRINK_BEER_FREQ
                - name: DRINK_WINE_FREQ
                - name: DRINK_LIQUOR_FREQ
                - name: DRINK_START_AGE
                - name: DRINK_STOP_AGE
                - name: DRINK_TOTAL_YEARS
                - name: SMOKE_CURRENT
                - name: SMOKE_MIN_100
                - name: SMOKE_DAILY_AMT
                - name: SMOKE_CIGAR_PIPE
                - name: SMOKE_SMOKELESS
                - name: SMOKE_START_AGE
                - name: SMOKE_STOP_AGE
                - name: SMOKE_TOTAL_YEARS
                - name: XP_AGENTORANGE
                - name: XP_ANTHRAX
                - name: XP_ASBESTOS
                - name: XP_BURNPIT
                - name: XP_CHROMIUM
                - name: XP_CONSTRUCT
                - name: XP_MICROWAVE
                - name: XP_MUSTARD
                - name: XP_NUCLEAR
                - name: XP_PAINT
                - name: XP_PERCHLORATE
                - name: XP_PESTICIDE
                - name: XP_PETROLEUM
                - name: XP_RADIATION
                - name: XP_RESP
                - name: XP_URANIUM
                - name: XP_WARFARE
                - name: XP_WOUNDS
                - name: XP_XRAY
                - name: XP_OTHER
                - name: MILITARY_ASSOCIATION
            - name: oncology_primaries
              path: oncology_primaries
              props:
                - name: ICDOSite
                - name: Stagegroupclinical
                - name: Texthistologytitle
                - name: Gradedifferentiation
                - name: Stagegroupbest
                - name: PrimarysiteX
                - name: Histologyicdo3X
            - name: somatic_mutations
              path: somatic_mutations
              props:
                - name: Gene
                - name: Mutation
          joining_props:
            - index: file
              join_on: _case_id
              props:
                - name: object_id
                  src: object_id
                  fn: set
                - name: data_format
                  src: data_format
                  fn: set
                - name: data_type
                  src: data_type
                  fn: set
                - name: data_category
                  src: data_category
                  fn: set
        - name: qa_vpodc_file
          doc_type: file
          type: collector
          root: None
          category: data_file
          props:
            - name: source_node
            - name: project_id
            - name: submitter_id
            - name: case_submitter_id
            - name: data_category
            - name: data_format
            - name: data_type
            - name: file_name
            - name: file_size
            - name: md5sum
            - name: object_id
            - name: modality
            - name: body_part_examined
            - name: study_instance_uid
            - name: series_instance_uid
            - name: study_description
            - name: state
          injecting_props:
            case:
              props:
                - name: _case_id
                  src: id
                  fn: set

