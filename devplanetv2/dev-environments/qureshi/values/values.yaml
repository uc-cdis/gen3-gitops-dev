# Database configuration

elasticsearch:
  persistence:
    enabled: true

# -- (map) To configure postgresql subchart
postgresql:
  primary:
    persistence:
      # -- (bool) Option to persist the dbs data.
      enabled: true

fence:
  externalSecrets:
    createK8sFenceConfigSecret: false
    createK8sJwtKeysSecret: true
    createK8sGoogleAppSecrets: true
    fenceConfig: "devplanetv2-generic-fence-config"
  usersync:
    usersync: true
    userYamlS3Path: s3://cdis-gen3-users/dev/user.yaml
  # Only values that differ from the fence chart defaults. Everything else this file used to
  # restate matched helm/fence/values.yaml exactly, so it added nothing but drift risk.
  FENCE_CONFIG_PUBLIC:
    BASE_URL: https://qureshi.dev.planx-pla.net/user

    # -- (string) Name of the Fence app
    APP_NAME: "fence"

    # -- (bool) fake a successful login response from Google in /login/google, logging in as
    # the username in DEV_LOGIN_COOKIE_NAME. Also changes /link/google behaviour.
    MOCK_GOOGLE_AUTH: true

    # List of enabled login options (used by data-portal to display login buttons).
    LOGIN_OPTIONS:
      - name: 'Login from Google'
        idp: google

    # Extra whitelisted URLs the /login/* endpoints may redirect to.
    LOGIN_REDIRECT_WHITELIST: [".", "/login"]

    # NOTE: GOOGLE_BULK_UPDATES is deliberately unset (chart default is false).
    # sync_users.py:949 gates update_google_groups_for_users on it, and that reads
    # fence-google-storage-creds-secret, whose keys are zero bytes in this namespace. With it
    # true usersync died on "JSONDecodeError: Expecting value: line 1 column 1 (char 0)" before
    # pushing anything to Arborist. Turn it back on once real credentials exist.

    # NOTE: STORAGE_CREDENTIALS is deliberately unset. Configuring a google backend here sends
    # usersync through GoogleCloudManager, which reads fence-google-storage-creds-secret. That
    # secret is empty in this environment, so usersync died with
    # "JSONDecodeError: Expecting value: line 1 column 1 (char 0)" before reaching the Arborist
    # push. Set it only once real service account credentials exist in Secrets Manager.

    # the cred values should be keys in section `AWS_CREDENTIALS`.
    S3_BUCKETS:
      cdis-presigned-url-test:
        region: 'us-east-1'
        cred: 'cdistest'
      gen3-helm-data-upload-bucket:
        region: 'us-east-1'
        cred: 'cdistest'
    DATA_UPLOAD_BUCKET: 'gen3-helm-data-upload-bucket'

    # only used by the Google Oauth2Client at the moment if provided
    HTTP_PROXY:
      host: 'cloud-proxy.internal.io'
      port: 3128

    ENABLE_AUDIT_LOGS:
      presigned_url: true
      login: true
    PUSH_AUDIT_LOGS_CONFIG:
      type: aws_sqs
      aws_sqs_config:
        sqs_url: https://sqs.us-east-1.amazonaws.com/707767160287/audit-service-sqs
        region: us-east-1
        aws_cred: 'cdistest'

    # Ask users to register on login and add them to the configured Arborist group.
    REGISTER_USERS_ON: true

gen3-embeddings:
  enabled: true
  image:
    repository: quay.io/cdis/gen3_embeddings
    tag: feat_deployment
    pullPolicy: Always
  externalSecrets:
    createK8sGen3EmbeddingsSecret: true
  # extraEnv is a map and merges, unlike env which is a list and would replace the chart's
  # defaults (GEN3_DEBUG, ARBORIST_URL, PGPOOL_*) wholesale.
  extraEnv:
    ENABLE_CONTINUOUS_PROFILING: "true"
    PROFILE_MEMORY: "true"
    ENABLE_OPENTELEMETRY_TRACES: "true"
    # Alloy's pyroscope.receive_http listener; it forwards to pyroscope.planx-pla.net.
    PYROSCOPE_SERVER_ADDRESS: "http://alloy.monitoring:4040"
