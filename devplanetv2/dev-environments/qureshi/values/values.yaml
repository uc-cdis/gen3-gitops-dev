revproxy:
  resources:
    requests:
      memory: "105Mi"
      cpu: "15m"
  ingress:
    aws:
      # Do not change- this will break DNS for your env.
      group: devplanetv2-internal
  additionalConfigs:
    gen3-agentic-service.conf: |-
      # API calls from the frontend arrive as /agentic/api/... — strip /agentic
      # and forward to the backend. This must come before the frontend block so
      # nginx matches the more specific prefix first.
      location ^~ /agentic/api/ {
          set $proxy_service "gen3-agentic-api";
          set $upstream http://gen3-agentic.qureshi.svc.cluster.local:8080;
          rewrite ^/agentic(/api/.*) $1 break;
          proxy_pass $upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          # SSE / streaming support
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 600s;
          proxy_send_timeout 600s;
          chunked_transfer_encoding on;
          proxy_set_header Connection '';
          proxy_http_version 1.1;
      }

      # Frontend: pass /agentic and /agentic/* as-is to Next.js.
      # basePath=/agentic is baked into the image so Next.js handles the prefix natively.
      location ~ ^/agentic(/|$) {
          # Redirect unauthenticated users to login instead of returning 401.
          error_page 401 = @agentic_login_redirect;

          set $proxy_service "gen3-agentic";
          set $upstream http://gen3-agentic.qureshi.svc.cluster.local:3000;
          proxy_pass $upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          # SSE / streaming support for Next.js RSC and chat stream
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 600s;
          proxy_send_timeout 600s;
          chunked_transfer_encoding on;
          proxy_set_header Connection '';
          proxy_http_version 1.1;
      }

      location @agentic_login_redirect {
          return 302 https://$host/login?redirect=/agentic/;
      }

