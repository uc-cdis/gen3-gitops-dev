# Default StorageClass for the cluster.
#
# EBS gp3 is cheaper than gp2 (lower $/GiB, includes 3000 IOPS / 125 MiB/s
# baseline at no extra cost) and should be the cluster default for new PVCs,
# including the user volume PVCs that hatchery creates for workspace pods.
#
# NOTE: only one StorageClass may carry the
# storageclass.kubernetes.io/is-default-class annotation. If the cluster
# currently has a different default (e.g. a gp2 class created at bootstrap),
# remove its annotation before merging this:
#   kubectl annotate sc <old-class> storageclass.kubernetes.io/is-default-class-
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
